# IMS-Core - production stack
#
#   docker compose up -d            # first start generates all secrets automatically
#   docker compose logs backend | grep -A2 "Setup token"
#
# Only the `web` service (Caddy) publishes ports. Everything else lives on the
# internal network. Secrets are generated once by `init` into the `ims-secrets`
# volume and are never written to the repository.
name: ims

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  init:
    image: alpine:3.22
    command: ["/bin/sh", "/opt/ims/generate-secrets.sh"]
    volumes:
      - ims-secrets:/secrets
      - ./data:/data
      - ./docker/init/generate-secrets.sh:/opt/ims/generate-secrets.sh:ro
    restart: "no"
    network_mode: none
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ims
      POSTGRES_USER: ims
      POSTGRES_PASSWORD_FILE: /run/ims-secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ims-secrets:/run/ims-secrets:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims -d ims"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$(cat /run/ims-secrets/redis_password)"
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --protected-mode yes
    volumes:
      - redis-data:/data
      - ims-secrets:/run/ims-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/ims-secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ims-core-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      IMS_PUBLIC_URL: ${IMS_PUBLIC_URL:-https://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      ACCESS_TOKEN_TTL_SEC: ${ACCESS_TOKEN_TTL_SEC:-900}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      DATA_DIR: /app/data
      SECRETS_DIR: /run/ims-secrets
      IMS_MASTER_KEY_FILE: /run/ims-secrets/master_key
      JWT_ACCESS_SECRET_FILE: /run/ims-secrets/jwt_access_secret
      IMS_SETUP_TOKEN_FILE: /run/ims-secrets/setup_token
      TRUST_PROXY: "loopback, uniquelocal"
    volumes:
      - ims-secrets:/run/ims-secrets:ro
      # Bind mount: shared with the host-side updater (update requests/status, agent releases).
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # `public` provides egress only (Telegram / GitHub APIs); no ports are published.
    networks: [internal, public]
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ims-core-web:local
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      IMS_DOMAIN: ${IMS_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [internal, public]
    logging: *default-logging

networks:
  internal:
    internal: true
  public: {}

volumes:
  ims-secrets:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
